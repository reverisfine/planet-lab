<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F1F3F6">

<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" rx="13" fill="%2316243F"/><defs><linearGradient id="g" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="%23CFF5EC"/><stop offset=".5" stop-color="%237DD6C2"/><stop offset="1" stop-color="%232E8A78"/></linearGradient></defs><ellipse cx="30" cy="32" rx="22" ry="7" fill="none" stroke="%232A7A6A" stroke-width="2.6" transform="rotate(-20 30 32)"/><circle cx="30" cy="32" r="12" fill="url(%23g)"/><ellipse cx="26" cy="28" rx="3.4" ry="2.3" fill="%23fff" opacity=".45"/><ellipse cx="30" cy="32" rx="22" ry="7" fill="none" stroke="%23D7F5EE" stroke-width="2.6" transform="rotate(-20 30 32)" stroke-dasharray="23 78" stroke-dashoffset="-2"/><g fill="%23D7F5EE"><circle cx="11" cy="13" r="1.2"/><circle cx="49" cy="18" r="1"/></g></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" rx="13" fill="%2316243F"/><defs><linearGradient id="g" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="%23CFF5EC"/><stop offset=".5" stop-color="%237DD6C2"/><stop offset="1" stop-color="%232E8A78"/></linearGradient></defs><ellipse cx="30" cy="32" rx="22" ry="7" fill="none" stroke="%232A7A6A" stroke-width="2.6" transform="rotate(-20 30 32)"/><circle cx="30" cy="32" r="12" fill="url(%23g)"/><ellipse cx="26" cy="28" rx="3.4" ry="2.3" fill="%23fff" opacity=".45"/><ellipse cx="30" cy="32" rx="22" ry="7" fill="none" stroke="%23D7F5EE" stroke-width="2.6" transform="rotate(-20 30 32)" stroke-dasharray="23 78" stroke-dashoffset="-2"/><g fill="%23D7F5EE"><circle cx="11" cy="13" r="1.2"/><circle cx="49" cy="18" r="1"/></g></svg>'>
<title>은또링쌤의 행성탐사대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6; --card:#FFFFFF; --soft:#F6F8FA; --soft2:#EDF0F4; --soft3:#E3E8EE;
  --ink:#16181D; --ink2:#454B57; --dim:#868D9A; --dim3:#B3BAC5;
  --line:#E9ECF1;
  --navy:#16243F; --navy2:#25395E; --navybg:#EEF1F7;
  --gold:#C9922A; --goldbg:#FBF3E2;
  --mint:#2A8A76; --mint2:#7DD6C2; --mintbg:#E3F5F0;
  --red:#B23A2E;
  --ok:#12A46B; --okbg:#E6F6EF;
  --mid:#D99A2B; --midbg:#FBF3E2;
  --no:#D9503C; --nobg:#FCEDEA;
  --sh:0 1px 2px rgba(22,24,29,.04), 0 3px 12px rgba(22,24,29,.05);
  --sh2:0 10px 34px rgba(22,24,29,.16);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;background:var(--bg)}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);
  font-size:15px;line-height:1.6;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input{font:inherit}
svg{display:block}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.scr{display:none}
.scr.on{display:block;animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pad{max-width:520px;margin:0 auto;padding:0 16px}

/* ===== 상단바 ===== */
.nb{position:sticky;top:0;z-index:40;background:var(--bg);padding:calc(var(--st) + 8px) 16px 10px}
.nb-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.icb{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--card);box-shadow:var(--sh);
  display:grid;place-items:center;color:var(--ink2)}
.icb:active{background:var(--soft2)}
.nb .ttl{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:900;letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .ttl.l{text-align:left}
.nb .ttl .cv{display:inline-block;vertical-align:-2px;margin-left:3px;color:var(--dim)}
.nb .brand{flex:1;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:-.6px;min-width:0}
.nb .blogo{width:29px;height:29px;flex:0 0 29px}
.nb .brand .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb .brand .bt span{color:var(--mint)}
.grass{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;
  background:var(--card);box-shadow:var(--sh);font-size:12.5px;font-weight:900;color:var(--ink)}
.grass i{width:16px;height:16px;border-radius:5px;background:linear-gradient(180deg,#CFF5EC,#5FC3AC);flex:0 0 16px}

/* ===== 검색바 ===== */
.sbar{display:flex;width:100%;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;
  background:var(--card);box-shadow:var(--sh);margin-bottom:14px}
.sbar .ico{color:var(--dim3);flex:0 0 auto}
.sbar input{flex:1;border:0;outline:0;background:none;font-size:14.5px;color:var(--ink);min-width:0;font-weight:500}
.sbar input::placeholder{color:var(--dim3);font-weight:400}
.sbar.ghost{color:var(--dim3);font-size:14.5px;font-weight:400}


/* ===== 홈 상단 천구 ===== */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;
  background:radial-gradient(120% 94% at 50% 2%,#1C2C4A 0%,#0C1524 66%,#080D18 100%);
  box-shadow:0 8px 26px rgba(12,21,36,.26)}
.hero .cap{position:absolute;left:15px;top:13px;z-index:3;pointer-events:none}
.hero .cap .k{font-size:9.5px;font-weight:900;letter-spacing:.18em;color:rgba(125,214,194,.92);text-transform:uppercase}
.hero .cap h3{margin:2px 0 0;font-size:14.5px;font-weight:900;color:#fff;letter-spacing:-.5px}
.hero .cnt{position:absolute;right:13px;top:13px;z-index:3;display:flex;align-items:center;gap:5px;
  height:26px;padding:0 11px;border-radius:99px;background:rgba(125,214,194,.14);
  border:1px solid rgba(125,214,194,.24);
  backdrop-filter:blur(6px);color:#9FE7D6;font-size:11px;font-weight:900;pointer-events:none}
.sphere{position:relative;z-index:0;isolation:isolate;width:100%;aspect-ratio:1/.78;
  touch-action:none;user-select:none}
.sphere canvas{width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
  display:flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 7px;border-radius:99px;
  background:rgba(255,255,255,.13);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);
  font-size:11px;font-weight:900;color:#fff;white-space:nowrap;transition:opacity .25s;
  box-shadow:0 3px 12px rgba(0,0,0,.45)}
.pin .d{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.pin .s{color:rgba(255,255,255,.6);font-weight:500}
.pin.done{background:rgba(217,154,43,.26);border-color:rgba(240,206,124,.6);color:#FFE0A3}
.pin:active{transform:translate(-50%,-50%) scale(.94)}
/* ===== 이어서 공부하기 ===== */
.resume{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-radius:18px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 6px 22px rgba(22,36,63,.24);
  margin-bottom:14px;transition:.14s}
.resume:active{transform:scale(.985)}
.resume .planet{width:52px;height:52px;flex:0 0 52px}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;font-size:15.5px;font-weight:900;letter-spacing:-.5px;line-height:1.4}
.resume .t .go{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:#B9C6DC;font-weight:500;min-width:0}
.resume .t .go .lb{flex:0 0 auto;white-space:nowrap}
.resume .t .go .chip{background:rgba(255,255,255,.94);color:var(--navy);border-radius:99px;
  padding:4px 11px;font-size:11px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .cv{color:rgba(255,255,255,.6);flex:0 0 auto}

/* ===== 공통 카드 ===== */
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.card.pad{padding:17px 17px 18px}
.card .hd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;letter-spacing:-.5px}
.card .hd .ico{width:19px;color:var(--navy)}
.card .desc{margin:9px 0 0;font-size:13px;color:var(--dim);font-weight:500;line-height:1.65;word-break:keep-all}
.linkrow{display:flex;align-items:center;gap:11px;width:100%;padding:17px 17px}
.linkrow .ico{width:19px;color:var(--navy);flex:0 0 auto}
.linkrow b{flex:1;font-size:16px;font-weight:900;letter-spacing:-.5px}
.linkrow .cnt{font-size:13px;font-weight:900;color:var(--mint)}
.linkrow .cv{color:var(--dim3);flex:0 0 auto}
.linkrow:active{background:var(--soft)}

/* ===== 핵심 단원 박스 ===== */
.corebox{position:relative;border:2px solid var(--navy);border-radius:20px;padding:26px 14px 16px;
  margin:30px 0 14px;background:var(--card)}
.corebox .tag{position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;font-size:12.5px;font-weight:900;letter-spacing:-.3px;
  padding:7px 18px;border-radius:99px;white-space:nowrap}
.corebox .lead{text-align:center;font-size:13px;color:var(--ink2);font-weight:500;margin:0 0 14px}
.urow{display:flex;align-items:center;gap:13px;width:100%;padding:13px 12px;border-radius:14px;
  background:var(--soft);margin-bottom:9px;transition:.14s}
.urow:last-of-type{margin-bottom:0}
.urow:active{background:var(--soft2)}
.urow .gno{flex:0 0 auto;min-width:52px;height:36px;border-radius:11px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:900;letter-spacing:-.4px}
.urow.done .gno{background:var(--mint)}
.urow .t{flex:1;min-width:0}
.urow .t b{display:block;font-size:15px;font-weight:900;letter-spacing:-.5px;line-height:1.35;word-break:keep-all}
.urow .t .tr{display:block;height:4px;border-radius:99px;background:var(--soft3);margin-top:7px;overflow:hidden}
.urow .t .tr i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s}
.urow .v{font-size:12.5px;font-weight:700;color:var(--dim);flex:0 0 auto}
.coretot{text-align:center;font-size:13.5px;font-weight:900;color:var(--navy);margin-top:14px}
.morebtn{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 auto 14px;
  height:44px;padding:0 22px;border-radius:99px;background:var(--navy);color:#fff;
  font-size:13.5px;font-weight:900;letter-spacing:-.3px}
.morebtn .cv{transition:transform .2s}
.morebtn.open .cv{transform:rotate(180deg)}
.diag{margin:0 0 14px;padding:14px 16px;border-radius:14px;background:#FCEDEA;border:1.5px solid #F0BDB2}
.diag b{display:block;font-size:13.5px;font-weight:900;color:#B23A2E;margin-bottom:6px}
.diag ul{margin:0;padding-left:17px;font-size:12px;color:#8A3D31;line-height:1.75}
.foot{text-align:center;padding:22px 0 10px;color:var(--dim3);font-size:11px;font-weight:500}
</style>
<style>
/* ===== 강 화면 : 대분류 아코디언 트리 ===== */
.gbox{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:11px;overflow:hidden}
.ghd{display:flex;align-items:center;gap:9px;width:100%;padding:17px 16px}
.ghd .gno2{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:900}
.gbox.open .ghd .gno2{background:var(--mint)}
.ghd b{flex:1;font-size:16px;font-weight:900;letter-spacing:-.6px;line-height:1.35;word-break:keep-all}
.gbox.open .ghd b{color:var(--navy)}
.ghd .meta{font-size:12px;color:var(--dim);font-weight:500;flex:0 0 auto}
.ghd .cv{color:var(--dim3);flex:0 0 auto;transition:transform .22s}
.gbox.open .ghd .cv{transform:rotate(180deg)}
.gbody{display:none;padding:0 16px 4px}
.gbox.open .gbody{display:block}
.tree{position:relative;padding-left:4px}
.sub{position:relative;padding:11px 0 11px 22px}
.sub:before{content:'';position:absolute;left:4px;top:0;bottom:0;width:1.5px;background:var(--soft3)}
.sub:last-of-type:before{bottom:auto;height:23px}
.sub:after{content:'';position:absolute;left:4px;top:23px;width:13px;height:1.5px;background:var(--soft3)}
.subhd{display:flex;align-items:center;gap:8px;width:100%}
.subhd b{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.4px;line-height:1.4;word-break:keep-all}
.sub.open .subhd b{color:var(--navy);font-weight:900}
.subhd .meta{font-size:11.5px;color:var(--dim);font-weight:500;flex:0 0 auto}
.subhd .cv{color:var(--dim3);flex:0 0 auto;transition:transform .22s;width:16px}
.sub.open .subhd .cv{transform:rotate(180deg)}
.tree.flat{padding-left:0}
.tree.flat .tlist{padding:4px 0 2px}
.tree.flat .tlist:before{display:none}
.tree.flat .tpill:before{display:none}
.tlist.open{display:block}
.tlist{display:none;padding:10px 0 2px 14px;position:relative}
.sub.open .tlist{display:block}
.tlist:before{content:'';position:absolute;left:0;top:2px;bottom:14px;width:1.5px;background:var(--soft3)}
.tpill{display:flex;align-items:center;gap:9px;width:100%;padding:11px 13px;border-radius:12px;
  background:var(--soft);margin-bottom:7px;position:relative;transition:.14s}
.tpill:before{content:'';position:absolute;left:-14px;top:22px;width:13px;height:1.5px;background:var(--soft3)}
.tpill:active{background:var(--soft2)}
.tpill.know{background:var(--navy)}
.tpill.know .no{background:rgba(255,255,255,.16);color:#fff}
.tpill.know b{color:#fff}
.tpill.know .stars{color:#F0CE7C}
.tpill .no{flex:0 0 auto;font-size:10.5px;font-weight:900;background:var(--card);color:var(--ink2);
  padding:3px 8px;border-radius:99px;box-shadow:var(--sh)}
.tpill b{flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.4px;line-height:1.4;word-break:keep-all}
.tpill .stars{font-size:11px;color:var(--mint);letter-spacing:1px;flex:0 0 auto}
.tpill .mk{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.mk.fuzzy{background:var(--mid)} .mk.no{background:var(--no)} .mk.bm{background:var(--navy)}
.allbtn{display:flex;align-items:center;gap:9px;width:100%;padding:14px 16px;margin:6px -16px 0;
  width:calc(100% + 32px);background:var(--navy);color:#fff;font-size:13.5px;font-weight:900;letter-spacing:-.3px}
.allbtn .ico{width:19px;height:19px;color:#F0CE7C}
.allbtn .cv{margin-left:auto;color:rgba(255,255,255,.5)}
.ubar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.ubar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.ubar .n{font-size:13px;font-weight:900;color:var(--ink)}
.ubar .n span{color:var(--dim);font-weight:500}
.ubar .go{margin-left:auto;display:flex;align-items:center;gap:7px;height:44px;padding:0 20px;
  border-radius:99px;background:var(--navy);color:#fff;font-size:13.5px;font-weight:900;letter-spacing:-.3px}
.ubar .go:active{transform:scale(.97)}

/* ===== 학습 화면 ===== */
.crumb{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;max-width:520px;margin:0 auto}
.crumb::-webkit-scrollbar{display:none}
.crumb .c{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:var(--dim);white-space:nowrap}
.crumb .c b{background:var(--card);border-radius:99px;padding:7px 13px;box-shadow:var(--sh);font-weight:700}
.crumb .c.on b{background:var(--navybg);color:var(--navy);box-shadow:none;border:1.5px solid var(--navy);font-weight:900}
.crumb .c .sep{color:var(--dim3)}
.thead{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:15px 16px 17px}
.thead-in{max-width:520px;margin:0 auto}
.thead .r1{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.thead .tno{font-size:11px;font-weight:900;background:rgba(255,255,255,.15);border-radius:99px;padding:5px 12px}
.thead .src{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  background:rgba(125,214,194,.2);color:#9FE7D6;border-radius:99px;padding:6px 12px;transition:.14s}
.thead .src:active{background:rgba(125,214,194,.34)}
.thead .src.off{background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);pointer-events:none}
.thead .src.off .ico{display:none}
.thead .bm{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:rgba(255,255,255,.65)}
.thead .bm.on{color:#F0CE7C}
.thead .bm .ico{width:19px}
.thead h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.9px;line-height:1.36;word-break:keep-all}
.thead .stars{font-size:13px;color:#F0CE7C;letter-spacing:2px;margin-left:6px;vertical-align:2px}
.thead .stars i{color:rgba(255,255,255,.28);font-style:normal}

/* 모드 세그먼트 */
.segwrap{display:flex;justify-content:flex-end;padding:14px 16px 0;max-width:520px;margin:0 auto}
.seg{display:flex;gap:2px;padding:4px;border-radius:99px;background:var(--card);box-shadow:var(--sh)}
.seg button{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:700;color:var(--dim);transition:.16s;text-align:center}
.seg button.on{background:var(--navy);color:#fff;font-weight:900}
.seg button.on.ans{background:var(--red)}

/* 인출 블록 */
.blk{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 15px 12px;margin-bottom:12px}
.blk .q{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.blk .q b{flex:1;font-size:15px;font-weight:900;letter-spacing:-.5px;line-height:1.4;word-break:keep-all}
.blk .q .n{color:var(--mint);font-weight:900;font-size:16px}
.blk .q .note{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;color:var(--dim3)}
.blk .q .note.on{color:var(--navy);background:var(--navybg)}
.blk .q .note .ico{width:18px}
.ans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ans li{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.6}
.ans li .i{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--dim);padding-top:9px;min-width:11px;text-align:right}
.ans li{flex-wrap:wrap}
.ans li .v{flex:1;min-height:38px;border-radius:10px;background:var(--soft2);padding:8px 12px;

{id:'L15-12',g:15,t:'근로계약 관계의 종료',b:'book',n:1,d:'근로관계가 끝나는 방식은 <em>누가 먼저 끝내자고 했는지</em>로 갈립니다. 근로자가 먼저면 자진 사직, 사용자가 권하고 근로자가 받아들이면 권고사직, 사용자가 일방적으로 끊으면 해고입니다.\n\n실업급여는 원칙적으로 자발적 사직에는 나오지 않지만 <em>경영상 이유의 권고사직은 받을 수 있습니다.</em> 해고는 정당한 이유와 30일 전 서면 통지가 모두 있어야 효력이 생깁니다.',k:[
 '<em>자진 사직</em> — 통상 30일 전 통보, 급히 그만두면 무단결근 처리로 퇴직금 산정에 불이익',
 '<em>권고사직</em> — 사용자의 권고에 근로자가 응함, 경영상 이유면 <em>실업급여 수급 가능</em>||형식은 근로자가 동의한 사직이지만 실제로는 <em>비자발적</em>으로 봅니다.',
 '<em>해고</em> — 정당한 이유 + <em>30일</em> 전 사유·시기를 적은 문서 통지(해고 예고)',
 '즉시 해고 가능 — 계속근로 <em>3개월</em> 미만',
 '즉시 해고 가능 — 천재·사변 등으로 사업 계속이 불가능',
 '즉시 해고 가능 — 근로자가 고의로 막대한 지장·재산상 손해를 끼친 경우']},
{id:'L15-13',g:15,t:'임금 지급의 4원칙',b:'book',d:'임금 지급 4원칙은 <em>받을 사람이 제때 온전히 받게</em> 하는 장치입니다.\n\n통화불은 현물이나 상품권 대신 현금으로, 직접불은 가족이 대신 받지 못하게, 전액불은 함부로 떼지 못하게, 정기불은 매월 정해진 날에 주라는 뜻입니다. 네 글자 「통·직·전·정」으로 묶으면 편합니다.',k:[
 '<em>통화불</em> — 현금으로 지급(현물·상품권 ✕)','<em>직접불</em> — 근로자 본인에게(대리 수령 ✕)',
 '<em>전액불</em> — 전액 지급(법령·단협 외 임의 공제 ✕)','<em>정기불</em> — 매월 1회 이상 일정한 날']},
{id:'L15-14',g:15,t:'평균임금 — 정의와 쓰임',b:'book',p:'L15-15',d:'평균임금은 <em>지난 3개월간 실제로 받은 총액</em>을 날짜로 나눈 값입니다. 상여금이나 수당까지 다 들어가므로 대체로 통상임금보다 큽니다.\n\n그래서 퇴직금처럼 근로자에게 크게 지급해야 하는 돈에 씁니다. 통상임금과 헷갈리기 쉬우니 반드시 짝으로 비교해 두세요.',k:[
 '산정 사유 발생일 이전 <em>3개월</em> 임금 총액 ÷ 그 기간의 총일수','퇴직금','휴업수당','연차수당','재해보상금']},
{id:'L15-15',g:15,t:'통상임금 — 정의와 쓰임',b:'book',p:'L15-14',d:'통상임금은 <em>정기적·일률적으로 주기로 미리 정해 둔 금액</em>입니다. 실제로 얼마 받았느냐가 아니라 약속된 금액이 기준입니다.\n\n그래서 연장·야간·휴일 수당처럼 「50% 가산」을 계산할 때 밑돌로 씁니다. 평균임금이 「지난 실적」이라면 통상임금은 「정해진 약속」입니다.',k:[
 '정기적·일률적으로 지급하기로 정한 시간급·일급·월급 등','해고예고수당','연장근로수당','야간근로수당','휴일근로수당']},
{id:'L15-16',g:15,t:'노동 쟁의 조정 3종',b:'book',x:['25수능 8번'],p:'L19-10',d:'쟁의가 생겼을 때 노동위원회가 끼어드는 방식이 셋입니다. <em>구속력이 있느냐</em>로 갈라 보면 쉽습니다.\n\n조정은 안을 제시하고 받아들이라고 권할 뿐이라 강제력이 없습니다. 중재는 내려진 재정이 단체 협약과 같은 효력을 가져 반드시 따라야 합니다. 긴급조정은 국민 경제에 큰 영향이 있을 때 고용노동부 장관이 결정하며, 즉시 쟁의를 멈춰야 합니다.',k:[
 '<em>조정</em> — 노동위원회 조정위원회가 조정안 제시·수락 권고, <em>구속력 없음</em>',
 '<em>중재</em> — 쌍방 신청 또는 단협에 의한 일방 신청, <em>구속력 있음</em>(지노위 불복 시 중노위 재심)||중재 재정은 <em>단체 협약과 같은 효력</em>을 가집니다. 조정과 갈리는 결정적 지점입니다.',
 '<em>긴급 조정</em> — 국민 경제에 큰 영향 시 고용노동부 장관 결정, 중앙노동위원회, 즉시 쟁의 중지']},
{id:'L15-17',g:15,t:'쟁의 행위의 결정 절차',b:'book',n:1,d:'파업 같은 쟁의 행위는 조합 간부 몇 명이 정할 수 없습니다. <em>조합원 과반수의 찬성</em>을 받아야 합니다.\n\n투표는 직접·비밀·무기명으로 해야 합니다. 조합원 개인이 압력을 받지 않고 진짜 뜻을 낼 수 있게 하려는 장치입니다.',k:[
 '조합원 <em>과반수</em>의 찬성으로 결정·실시','직접·비밀·무기명 투표']},
{id:'L15-18',g:15,t:'그 밖의 근로관계법과 목적',b:'book',d:'각 법의 목적 문장을 통째로 외우려 하지 말고 <em>핵심 낱말 하나</em>만 잡으세요.\n\n최저임금법은 「최저 수준」, 직업안정법은 「취업 기회」, 산재보험법은 「업무상 재해 보상」, 고용보험법은 「실업 예방」입니다. 선지에서 이 낱말이 뒤바뀌어 나오는 경우가 많습니다.',k:[
 '최저임금법 — 임금의 최저 수준 보장, 생활 안정·노동력 질적 향상','직업안정법 — 취업 기회 제공, 노동력 수급 지원',
 '산업재해보상보험법 — 업무상 재해 신속·공정 보상, 재활·사회 복귀','남녀고용평등·일가정양립지원법 — 고용상 남녀평등, 모성 보호',
 '고용보험법 — 실업 예방·고용 촉진·직업 능력 개발','직업교육훈련촉진법 — 직업교육훈련 기회 제공(현장 실습)']},

/* ─────────── 15강 · 교재 소분류 보강 ─────────── */
{id:'L15-19',g:15,t:'근로관계법의 개념',b:'book',d:'근로관계는 근로자와 사용자가 <em>근로 계약</em>을 맺는 순간 성립합니다. 두 사람 사이의 사적인 약속처럼 보이지만, 실제로는 사용자가 훨씬 우월한 위치에 있기 때문에 국가가 법으로 개입합니다.\n\n그 법이 근로관계법입니다. 근로자를 일방적으로 편드는 법이 아니라, <em>기울어진 관계를 수평으로 되돌리는</em> 장치라고 이해하면 됩니다.',k:[
 '<em>근로관계</em> — 근로자 개인과 사용자 간에 <em>근로 계약</em>을 통해 성립',
 '<em>근로관계법</em> — 근로자와 사용자의 권익 침해를 방지하기 위해 양자의 관계를 규정하는 법규',
 '근로자 — 직업의 종류와 관계없이 임금·급료로 생활하는 자(실업자·해고자도 노동조합 형태에 따라 포함)',
 '사용자 — 사업주, 사업의 경영 담당자, 사업주를 위해 행동하는 자']},
{id:'L15-20',g:15,t:'근로 계약 기간',b:'law',s:'기간제법 제4조',n:1,d:'계약 기간을 정해 두면 그 기간이 끝날 때 자동으로 관계가 끝납니다. 그래서 사용자가 계약을 짧게 반복 갱신하며 사람을 계속 불안정하게 쓰는 일이 생깁니다.\n\n이를 막기 위해 <em>2년을 넘기면 기간을 정하지 않은 계약</em>으로 본다고 법이 정했습니다. 이때부터는 정당한 사유 없이 해고할 수 없습니다.',k:[
 '사용자와 근로자가 합의하여 일정 기간을 정할 수 있음',
 '<em>2년</em>을 초과하면 초과한 날부터 <em>기간을 정하지 않은 근로 계약</em>을 체결한 것으로 인정',
 '이 경우 정당한 사유 없이는 근로자를 해고할 수 없음']},
{id:'L15-21',g:15,t:'휴게 시간',b:'book',n:1,d:'휴게 시간은 쉬는 시간이므로 <em>일한 시간이 아니고 임금도 없습니다.</em> 점심시간이 근로 시간에 안 들어가는 이유가 이것입니다.\n\n4시간 일하면 30분, 8시간 일하면 1시간이며, 일이 끝난 뒤가 아니라 반드시 <em>근로 시간 도중</em>에 줘야 합니다. 손님을 기다리며 대기하는 시간은 사용자의 지휘 아래 있으므로 휴게가 아니라 근로 시간입니다.',k:[
 '근로 시간 <em>4시간</em>이면 <em>30분</em> 이상',
 '근로 시간 <em>8시간</em>이면 <em>1시간</em> 이상',
 '근로 시간 <em>도중</em>에 부여해야 함',
 '근로 시간에 포함되지 않으며 <em>임금도 지급되지 않음</em>',
 '사용자의 지시·감독 없이 <em>자유롭게 사용</em>']},
{id:'L15-22',g:15,t:'휴일과 주휴일',b:'book',n:1,p:'L15-23',d:'휴일은 <em>일할 의무 자체가 없는 날</em>입니다. 법정 휴일은 법이 반드시 주라고 한 날이고, 약정 휴일은 회사와 정하기 나름입니다.\n\n주휴일은 그 주에 정해진 날을 <em>개근</em>해야 유급으로 받습니다. 결근하면 쉬긴 쉬되 돈은 못 받습니다. 주 15시간 미만으로 일하는 초단시간 근로자에게는 아예 적용되지 않습니다.',k:[
 '<em>법정 휴일</em> — 법에 의해 반드시 부여(주휴일, 근로자의 날 <em>5월 1일</em>, 법정 공휴일)',
 '<em>약정 휴일</em> — 단체 협약·취업 규칙·근로 계약으로 정한 휴일, 유급 여부는 약정에 따름',
 '<em>주휴일</em> — 1주간 근로일을 <em>개근</em>한 경우 주에 평균 <em>1회</em> 이상 부여되는 유급 휴일',
 '결근한 경우 <em>무급</em>으로 주휴일을 부여||휴일 자체가 없어지는 것이 아니라 <em>돈만 안 나오는 것</em>입니다.',
 '초단시간 근로(1주 <em>15시간 미만</em>)에는 적용되지 않음',
 '※ 주휴일이 반드시 토요일·일요일이어야 하는 것은 아님']},
{id:'L15-23',g:15,t:'휴가 — 연차 유급휴가와 생리휴가',b:'book',n:1,p:'L15-22',d:'휴가는 <em>일할 의무는 있지만 신청해서 면제받는 날</em>입니다. 휴일과 이 점이 다릅니다.\n\n연차는 근속 기간에 따라 세 단계로 커집니다. 1년 미만은 한 달 개근마다 1일, 1년 이상은 80% 이상 출근하면 15일, 3년 이상부터는 2년마다 1일씩 붙어 최대 25일입니다. 생리휴가는 개근과 무관하지만 <em>무급</em>이고, 신청하지 않으면 사라집니다.',k:[
 '계속근로 <em>1년 미만</em> — 주 평균 15시간 이상 근무 + <em>1개월 개근</em> 시 <em>1일</em>',
 '계속근로 <em>1년 이상</em> — 1년간 <em>80% 이상</em> 근무 시 다음 해에 <em>15일</em>',
 '계속근로 <em>3년 이상</em> — 최초 1년을 초과하는 매 <em>2년</em>마다 <em>1일</em> 가산, 총 <em>25일</em> 한도',
 '주 <em>15시간 미만</em> 근로자에게는 연차 유급휴가를 부여하지 않아도 됨',
 '<em>생리휴가</em> — 개근 여부와 무관, 월 <em>1일</em>, <em>무급</em>, 신청하지 않으면 소멸||연차와 달리 <em>쌓이지 않습니다.</em> 그달에 안 쓰면 그대로 사라집니다.']},
{id:'L15-24',g:15,t:'퇴직금',b:'book',n:1,d:'퇴직금은 오래 일한 사람에게 주는 목돈입니다. 조건이 둘 다 맞아야 합니다. <em>1년 이상 계속 근로</em>와 <em>주 15시간 이상</em>입니다.\n\n금액은 1년당 30일분의 평균임금이므로, 3년 일했으면 약 90일분입니다. 연봉에 미리 포함시키는 이른바 「퇴직금 포함 연봉」은 <em>법적으로 무효</em>라는 점도 알아 두세요.',k:[
 '계속근로 <em>1년 이상</em> + 4주 평균 1주 <em>15시간 이상</em> 근로자',
 '퇴사 사유를 <em>불문</em>하고 지급',
 '근로 기간 <em>1년당 30일분</em>의 평균임금',
 '퇴사일부터 <em>14일</em> 이내 지급||당사자가 합의하면 기간을 늘릴 수 있습니다. 임금 청산 기한 14일과 같은 숫자입니다.',
 '연봉·월급에 <em>합산할 수 없음</em>||이른바 「퇴직금 포함 연봉」 약정은 무효이며, 그렇게 나눠 준 돈은 퇴직금으로 인정되지 않습니다.',
 '※ 산정 — 퇴직 전 3개월 임금 ÷ 총일수 = 1일 평균임금 × 30일 × 근속연수']},
{id:'L15-25',g:15,t:'노동조합의 개념과 역할',b:'law',s:'노동조합 및 노동관계조정법',d:'노동조합은 근로자가 <em>스스로</em> 만든 단체여야 합니다. 회사가 만들어 주거나 운영비를 대 주면 자주성이 없어져 노동조합으로 인정받지 못합니다.\n\n가입은 자유이며 실업자나 해고자도 조합 형태에 따라 조합원이 될 수 있습니다. 공무원과 교원은 일반 규정이 아니라 <em>따로 정한 법률</em>을 따릅니다.',k:[
 '근로자가 <em>주체</em>가 되어 <em>자주적</em>으로 단결한 단체 또는 그 연합 단체',

(function(){

    const g=i+1, list=gT(g), n=list.length||(6+((g*7)%5));
    const y=1-(i/19)*2;
    const lat=Math.asin(Math.max(-1,Math.min(1,y)))/RAD*0.80;
    const lon=(i*GA)%360;
    const stars=[];
    for(let j=0;j<n;j++){
      const a=(j*GA+g*53.7)*RAD, r=5.4+3.15*Math.sqrt(j);
      const dlat=r*Math.sin(a);
      const dlon=r*Math.cos(a)/Math.max(Math.cos((lat+dlat)*RAD),.36);
      stars.push({lat:lat+dlat,lon:lon+dlon,id:list[j]?list[j].id:null});
    }
    const links=[];
    for(let j=1;j<stars.length;j++){
      let bi=0,bd=1e9;
      for(let i2=0;i2<j;i2++){
        const dy=stars[j].lat-stars[i2].lat;
        const dx=(stars[j].lon-stars[i2].lon)*Math.cos((stars[j].lat+stars[i2].lat)/2*RAD);
        const d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i2;}

})();

  const sy=open.reduce((a,c)=>a+Math.sin(c.lon*RAD),0);

function proj(lat,lon){
  const la=lat*RAD, lo=(lon-rot)*RAD;
  const cl=Math.cos(la), sl=Math.sin(la), co=Math.cos(lo), so=Math.sin(lo);
  const ct=Math.cos(tilt), st=Math.sin(tilt);

  const y=-sl*ct+cl*co*st;
  const z= sl*st+cl*co*ct;
  return{x,y,z};
}

      const a=pts[ia],b=pts[ib];
      if(a.p.z<=.02||b.p.z<=.02)return;
      const lit=a.s.id&&b.s.id&&stOf(a.s.id)==='know'&&stOf(b.s.id)==='know';
      const al=Math.min(a.p.z,b.p.z);
      cx2.strokeStyle=lit?'rgba(240,206,124,'+(.62*al)+')'
        :(c.ready?'rgba(160,196,240,'+(.16*al)+')':'rgba(130,150,180,'+(.07*al)+')');
      cx2.lineWidth=lit?1.5:1;
      cx2.beginPath();cx2.moveTo(cxp+a.p.x*R,cyp+a.p.y*R);cx2.lineTo(cxp+b.p.x*R,cyp+b.p.y*R);cx2.stroke();
    });
    pts.forEach(({p,s})=>{
      if(p.z<=.02)return;
      const X=cxp+p.x*R,Y=cyp+p.y*R,al=Math.min(1,p.z*1.25);
      const st=s.id?stOf(s.id):null;
      if(st==='know'){
        cx2.globalAlpha=al*.32;cx2.fillStyle='#F0CE7C';
        cx2.beginPath();cx2.arc(X,Y,6.4,0,6.284);cx2.fill();
        cx2.globalAlpha=al;cx2.fillStyle='#FFF0C8';
        cx2.beginPath();cx2.arc(X,Y,2.5,0,6.284);cx2.fill();
      }else{
        cx2.globalAlpha=al*(c.ready?.72:.34);
        cx2.fillStyle=st==='fuzzy'?'#F0B450':st==='no'?'#F4796B':(c.ready?'#7E8DA6':'#4A5468');
        cx2.beginPath();cx2.arc(X,Y,st?1.9:1.5,0,6.284);cx2.fill();
      }
      cx2.globalAlpha=1;
    });

  });
  placePins(cxp,cyp,R);
}
function placePins(cxp,cyp,R){
  CONS.forEach(c=>{
    const el=document.getElementById('pin'+c.g);if(!el)return;
    const p=proj(c.lat,c.lon);
    if(p.z<.13){el.style.display='none';return}
    el.style.display='flex';
    el.style.left=(cxp+p.x*R)+'px';
    el.style.top=(cyp+p.y*R-46)+'px';
    el.style.opacity=Math.min(1,(p.z-.13)*3.2);
    el.style.zIndex=String(100+Math.round(p.z*50));
  });
}
function buildPins(){
  $('#pins').innerHTML=CONS.filter(c=>c.ready).map(c=>{
    const lit=consLit(c),done=consDone(c);
    const col=done?'#F0CE7C':c.ready?(lit?'#E0A83C':'rgba(255,255,255,.45)'):'rgba(255,255,255,.25)';
    return '<button class="pin'+(done?' done':'')+(c.ready?'':' soon')+'" id="pin'+c.g+'" data-g="'+c.g+'">'
      +'<span class="d" style="background:'+col+'"></span>'+G2(c.g)+'강'
      +(c.ready?' <span class="s">'+lit+'/'+c.n+'</span>':'')+'</button>';
  }).join('');
  $$('#pins .pin').forEach(b=>{
    /* 핀 위에서 시작한 포인터는 천구 드래그로 넘기지 않는다 (클릭이 삼켜지는 문제) */
    b.addEventListener('pointerdown',e=>{e.stopPropagation();idle=110});
    b.addEventListener('click',e=>{e.stopPropagation();pick(+b.dataset.g)});
  });
}
function loop(){
  if(!drag){
    if(idle>0){ idle--; rot+=vel; }
    else rot+=spin+vel;
    vel*=.93; if(Math.abs(vel)<.001)vel=0;
    if(velT){ tilt=clamp(tilt+velT,-TMAX,TMAX); velT*=.9; if(Math.abs(velT)<1e-5)velT=0; }
  }
  draw(); RAF=requestAnimationFrame(loop);
}
/* 핀을 누르면 그 강 화면으로 진입 */
function pick(g){
  const l=gT(g);
  if(!l.length){toast(g+'강은 아직 준비 중입니다');return}
  buzz(8);UNIT=g;go('unit');
}
$('#sphere').addEventListener('pointerdown',e=>{
  drag=true;lastX=e.clientX;lastY=e.clientY;vel=0;velT=0;idle=110;
  try{$('#sphere').setPointerCapture(e.pointerId)}catch(_){}
});
/* 핀에 손이 닿기만 해도 천구를 멈춰 조준하기 쉽게 */
$('#pins').addEventListener('pointerdown',()=>{idle=110},true);
$('#pins').addEventListener('pointerover',()=>{idle=Math.max(idle,60)},true);
$('#sphere').addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  rot-=dx*.34; vel=-dx*.055;
  tilt=clamp(tilt+dy*.0055,-TMAX,TMAX); velT=dy*.0009;
});
$('#sphere').addEventListener('pointerup',()=>{drag=false});
/* 두 번 톡 치면 처음 시점으로 되돌아온다 */
$('#sphere').addEventListener('dblclick',e=>{
  e.preventDefault();velT=0;vel=0;buzz(8);
  const from=tilt,to=HOME_TILT,t0=performance.now();
  (function ease(){
    const k=Math.min(1,(performance.now()-t0)/420);
    tilt=from+(to-from)*(1-Math.pow(1-k,3));
    if(k<1)requestAnimationFrame(ease);
  })();
});
$('#sphere').addEventListener('pointercancel',()=>{drag=false});

        const hs=hintsOf(mainK(t));let j=0;
        $$('#studyBody .ans li').forEach((x,xi)=>{
          const a=isAux(t.k[xi]);
          if(x===li)tx.innerHTML=a?'＋':esc(hs[j]||'');
          if(!a)j++;
        });
      }
    }else{
      li.classList.add('rv');
      tx.innerHTML=isAux(k)?kBody(stripAux(k)):kBody(k);
      buzz(4);
    }
  }));
  $$('#studyBody .inf').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const li=b.closest('li');li.classList.toggle('open');buzz(5);
  }));
  $$('#judge .jb').forEach(b=>b.addEventListener('click',()=>{
    const j=b.dataset.j,pv=DB.st[t.id]||{n:0};
    DB.st[t.id]={s:j,n:(pv.n||0)+1,t:Date.now()};
    DB.today.c++;tick();save();buzz(j==='know'?10:6);
    $$('#judge .jb').forEach(x=>x.classList.toggle('on',x.dataset.j===j));
    if(MODE==='quiz')setMode('ans');
    setTimeout(()=>{if(FI<FLOW.length-1){FI++;renderStudy()}else toast('이 범위를 모두 확인했습니다')},420);
  }));
  setMode(MODE==='quiz'?'quiz':MODE);
  $('#pagerMid').textContent=(FI+1)+' / '+FLOW.length;
  $('#prevBtn').disabled=FI===0;$('#nextBtn').disabled=FI===FLOW.length-1;
}
$('#prevBtn').addEventListener('click',()=>{if(FI>0){FI--;MODE='quiz';renderStudy()}});
$('#nextBtn').addEventListener('click',()=>{if(FI<FLOW.length-1){FI++;MODE='quiz';renderStudy()}});

/* ===================== 노트 ===================== */
let NOTE='wrong',NG='all',PFOCUS=null;
function pairs(){const seen=new Set(),o=[];
  TOPICS.forEach(t=>{const b=t.p&&byId(t.p);if(!b)return;
    const k=[t.id,b.id].sort().join('|');if(seen.has(k))return;seen.add(k);o.push([t,b])});return o}
function lrow(t,q){
  const mk=s=>q?plain(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):plain(s);
  const kk=q?t.k.filter(k=>plain(k).toLowerCase().includes(q.toLowerCase())):[];
  const P=PATH[t.id]||{};
  return '<button class="lrow" data-id="'+t.id+'"><span class="mk2 '+(stOf(t.id)||'none')+'"></span>'
    +'<span class="t"><b>'+mk(t.t)+'</b><small>'+G2(t.g)+'강 · '+(P.G?(P.G.no||P.G.rn)+'. '+P.G.nm:GNAME(t.g))+'</small>'
    +(kk.length?'<span class="kw">'+kk.slice(0,2).map(k=>'· '+mk(stripAux(k))).join('<br>')+'</span>':'')
    +'</span>'+(isBM(t.id)?'<span class="bmk"><svg class="ico" viewBox="0 0 24 24"><use href="#i-bookmark"/></svg></span>':'')
    +'<svg class="ico cv" style="width:17px" viewBox="0 0 24 24"><use href="#i-chev"/></svg></button>';
}
$$('#noteTabs button').forEach(b=>b.addEventListener('click',()=>{NOTE=b.dataset.t;PFOCUS=null;renderNote()}));
function renderNote(){
  const w=wrongs(),b=bms();
  $('#cW').textContent=w.length;$('#cB').textContent=b.length;$('#cP').textContent=pairs().length;
  $$('#noteTabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===NOTE));
  $('#noteTitle').textContent=NOTE==='bm'?'다시 볼 토픽':NOTE==='pair'?'헷갈리기 쉬운 개념':'오답 노트';

  if(NOTE==='pair'){
    $('#noteChips').innerHTML='';
    $('#noteBody').innerHTML=pairs().map(([a,c])=>{
      const hot=PFOCUS&&(a.id===PFOCUS||c.id===PFOCUS);
      const li=t=>t.k.filter(k=>!isAux(k)).map(k=>'<li>'+k+'</li>').join('');
      return '<div class="pset" id="p-'+a.id+'"'+(hot?' style="outline:2px solid var(--navy);outline-offset:7px;border-radius:19px"':'')+'>'
        +'<div class="pcap">'+G2(a.g)+'강'+(a.g!==c.g?' · '+G2(c.g)+'강':'')+'</div>'
        +'<div class="pgrid"><div class="pc l"><h4>'+plain(a.t)+'</h4><ul>'+li(a)+'</ul></div>'
        +'<div class="pc r"><h4>'+plain(c.t)+'</h4><ul>'+li(c)+'</ul></div></div></div>'}).join('');
    if(PFOCUS)setTimeout(()=>{const e=document.getElementById('p-'+PFOCUS);
      e&&e.scrollIntoView({block:'center',behavior:'smooth'})},240);
    return;
  }
  let L=NOTE==='bm'?b:w;
  const gs=[...new Set(L.map(t=>t.g))].sort((x,y)=>x-y);
  $('#noteChips').innerHTML=gs.length>1?'<div class="chips" style="padding-left:0;padding-right:0">'
    +['all',...gs].map(g=>'<button class="chip'+(NG==g?' on':'')+'" data-g="'+g+'">'
      +(g==='all'?'전체':G2(g)+'강')+'<span class="n num">'+(g==='all'?L.length:L.filter(t=>t.g==g).length)+'</span></button>').join('')
    +'</div>':'';
  $$('#noteChips .chip').forEach(x=>x.addEventListener('click',()=>{NG=x.dataset.g;renderNote()}));
  if(NG!=='all')L=L.filter(t=>t.g==NG);

  if(!L.length){
    $('#noteBody').innerHTML='<div class="card"><div class="void"><svg class="ico" viewBox="0 0 24 24"><use href="#i-'+(NOTE==='bm'?'bookmark':'book')+'"/></svg>'
      +'<p>'+(NOTE==='bm'?'담아둔 토픽이 없습니다.<br>학습 화면 오른쪽 위 북마크를 눌러 담아보세요.'
        :'담긴 오답이 없습니다.<br>학습하면서 몰라요·헷갈려요로 판정하면 여기에 모입니다.')+'</p></div></div>';
    return;
  }
  $('#noteBody').innerHTML='<button class="btn p" id="runAll"><svg class="ico" style="width:17px" viewBox="0 0 24 24"><use href="#i-play"/></svg>'
    +L.length+'개 이어서 확인</button>'
    +'<div class="card" style="margin-bottom:12px">'+L.map(t=>lrow(t)).join('')+'</div>'
    +(NOTE==='wrong'?'<button class="btn g" id="clr">오답 표시 비우기</button>':'');
  $('#runAll').onclick=()=>openTopic(L[0].id,L);
  const cl=$('#clr');
  if(cl)cl.onclick=()=>{if(!confirm('오답 표시를 모두 지울까요?'))return;
    L.forEach(t=>delete DB.st[t.id]);save();renderNote();toast('표시를 비웠습니다')};
  $$('#noteBody .lrow').forEach(x=>x.addEventListener('click',()=>openTopic(x.dataset.id,L)));
}

/* ===================== 검색 ===================== */
function paint(q){
  q=(q||'').trim();
  if(!q){
    const hot=['구직급여','30일','파견','중대 재해','평균임금','노동위원회'];
    $('#qRes').innerHTML='<div class="chips" style="padding:0 0 14px">'
      +hot.map(h=>'<button class="chip" data-h="'+h+'">'+h+'</button>').join('')+'</div>'
      +'<div class="void"><svg class="ico" viewBox="0 0 24 24"><use href="#i-search"/></svg>'
      +'<p>공개된 토픽 '+TOPICS.length+'개.<br>낱말이나 숫자를 넣어 보세요.</p></div>';
    $$('#qRes .chip').forEach(b=>b.addEventListener('click',()=>{$('#q').value=b.dataset.h;paint(b.dataset.h)}));
    return;
  }
  const lq=q.toLowerCase();
  const hit=TOPICS.filter(t=>plain(t.t).toLowerCase().includes(lq)||t.k.some(k=>plain(k).toLowerCase().includes(lq)));
  if(!hit.length){$('#qRes').innerHTML='<div class="void"><svg class="ico" viewBox="0 0 24 24"><use href="#i-search"/></svg>'
    +'<p>“'+esc(q)+'” 결과가 없습니다.<br>다른 낱말로 찾아보세요.</p></div>';return}
  $('#qRes').innerHTML='<button class="btn s" id="runQ"><svg class="ico" style="width:17px" viewBox="0 0 24 24"><use href="#i-play"/></svg>'
    +hit.length+'개 이어서 학습</button><div class="card">'+hit.map(t=>lrow(t,q)).join('')+'</div>';
  $('#runQ').onclick=()=>openTopic(hit[0].id,hit);
  $$('#qRes .lrow').forEach(b=>b.addEventListener('click',()=>openTopic(b.dataset.id,hit)));
}
let _t;$('#q').addEventListener('input',e=>{clearTimeout(_t);_t=setTimeout(()=>paint(e.target.value),150)});

/* ===================== 시작 ===================== */
try{$('#verTx').textContent='데이터 v'+DATA_VERSION+' · 토픽 '+TOPICS.length+'개 · '}catch(e){}
renderHome();fit();loop();
</script></body></html>
